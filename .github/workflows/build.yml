name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            extra-substituters = https://autc04.cachix.org
            extra-trusted-public-keys = autc04.cachix.org-1:MyPhhbTlMACU1jhpdXlPlU4R4gyDEeNbuVYi/dU/2iU=
      - name: Check the host runner and flake
        run: nix flake check
      - name: Build every application variant
        run: >-
          nix build
          .#m68k
          .#powerpc
          .#powerpc-smoke
          .#fat
          .#powerpc-osx
          .#powerpc-osx-smoke
          --no-link
